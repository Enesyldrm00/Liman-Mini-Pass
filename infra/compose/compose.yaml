# Local development stack (ROADMAP 0.3).
# Start:  pnpm stack:up      (or: docker compose -f infra/compose/compose.yaml watch)
# Credentials below are for local development only.

name: liman

x-dev-app: &dev-app
  build:
    context: ../..
    dockerfile: infra/compose/dev.Dockerfile
  image: liman-dev:local
  restart: unless-stopped
  environment: &dev-env
    NODE_ENV: development
    LOG_LEVEL: debug
    DATABASE_URL: postgres://liman:liman@postgres:5432/liman
    REDIS_URL: redis://redis:6379
  networks: [liman-internal]

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liman
      POSTGRES_PASSWORD: liman
      POSTGRES_DB: liman
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    ports:
      # Host port 5433: 5432 is often taken by a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liman -d liman"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [liman-internal]

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [liman-internal]

  registry:
    image: registry:3.1.1
    restart: unless-stopped
    volumes:
      - registrydata:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"
    networks: [liman-internal]

  traefik:
    image: traefik:v3.7.20
    restart: unless-stopped
    ports:
      - "80:80"
      # Dashboard is reachable only from this machine.
      - "127.0.0.1:8080:8080"
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [liman-internal, liman-apps]

  migrate:
    <<: *dev-app
    restart: "no"
    command: ["pnpm", "--filter", "@liman/db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *dev-app
    command: ["pnpm", "--filter", "@liman/api", "dev"]
    # GitHub App settings and the allow list come from the repository's .env
    # (docs/github-app-setup.md). Values under `environment` win, so the connection
    # settings below always point at the containers, not at the host ports in .env.
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *dev-env
      PORT: "3000"
      LIMAN_PUBLIC_URL: http://liman.localhost
      # The key path in .env points at the host; inside the container it is the secret below.
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
    # Mounted read-only under /run/secrets, never copied into the image.
    secrets: [github_app_key]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`liman.localhost`) && PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
    develop:
      watch:
        - { action: sync, path: ../../apps/api/src, target: /repo/apps/api/src }
        - { action: sync, path: ../../packages/shared/src, target: /repo/packages/shared/src }
        - { action: sync, path: ../../packages/db/src, target: /repo/packages/db/src }
        - { action: rebuild, path: ../../pnpm-lock.yaml }

  worker:
    <<: *dev-app
    command: ["pnpm", "--filter", "@liman/worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker health-checks user apps, so it is on both networks.
    networks: [liman-internal, liman-apps]
    develop:
      watch:
        - { action: sync, path: ../../apps/worker/src, target: /repo/apps/worker/src }
        - { action: sync, path: ../../packages/shared/src, target: /repo/packages/shared/src }
        - { action: rebuild, path: ../../pnpm-lock.yaml }

  web:
    <<: *dev-app
    command: ["pnpm", "--filter", "@liman/web", "dev"]
    environment:
      NODE_ENV: development
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`liman.localhost`)
      traefik.http.routers.web.entrypoints: web
      traefik.http.services.web.loadbalancer.server.port: "5173"
    develop:
      watch:
        - { action: sync, path: ../../apps/web, target: /repo/apps/web, ignore: [node_modules/] }
        # Vite bundles @liman/shared from source (ADR-0019).
        - { action: sync, path: ../../packages/shared/src, target: /repo/packages/shared/src }
        - { action: rebuild, path: ../../pnpm-lock.yaml }

secrets:
  # GitHub App private key (docs/github-app-setup.md). The stack does not start without it.
  github_app_key:
    file: ../../secrets/app.pem

networks:
  # Liman's own services. User apps never join this network.
  liman-internal:
    name: liman-internal
  # User apps (Phase 1), Traefik and the worker.
  liman-apps:
    name: liman-apps

volumes:
  pgdata:
  redisdata:
  registrydata:
