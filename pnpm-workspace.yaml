packages:
  - "apps/*"
  - "packages/*"

# esbuild (used by tsx and vite) runs a postinstall script to verify its native binary.
# cpu-features, protobufjs and ssh2 come with testcontainers, msgpackr-extract with bullmq;
# their scripts only build optional native add-ons (SSH tunnelling, protobuf CLI, a faster
# msgpack codec) that Liman does not need.
allowBuilds:
  esbuild: true
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# Refuse to install on a Node version outside "engines" (pnpm 12 ignores this key in .npmrc).
engineStrict: true
